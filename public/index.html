<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0719">
<title>Nova Vanguard — 100 levels. 20 heroes. One endless challenge.</title>
<meta name="description" content="Nova Vanguard: a 100-level side-scrolling space shooter with 20 heroes, 100 bosses and ranked daily and weekly endless leaderboards.">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root { --ink: #1a1030; --night: #0d0719; --panel: rgba(22,12,44,.92); --lav: #c9bde8; --cyan: #5ef2f2; --gold: #ffe08a; --text: #f3eefc; color-scheme: dark;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #0d0719; --text: #f3eefc; } }
:root[data-theme="dark"] { --night: #0d0719; --text: #f3eefc; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#root { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); display: flex; align-items: center; justify-content: center; }
.stage { position: relative; overflow: hidden; border-radius: 6px; }
canvas { position: absolute; inset: 0; display: block; }
.ui { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: var(--text); }
h1, h2, h3, .btn, .tile, .big, .loading { font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; }
.title { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; height: 100%; padding: 0 56px; gap: 28px; box-sizing: border-box; background: linear-gradient(90deg, rgba(13,7,25,.15), rgba(13,7,25,.55)); }
.hero { display: flex; flex-direction: column; align-items: flex-start; }
.heroimg { width: 250px; height: 250px; margin: -10px 0 -18px -24px; animation: float 3.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .heroimg { animation: none; } }
h1 { font-weight: 800; font-size: 84px; line-height: .95; margin: 0; letter-spacing: -1.5px; color: var(--text); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.tag { font-size: 20px; color: var(--lav); margin: 10px 0 0; max-width: 30ch; }
.menu { display: flex; flex-direction: column; gap: 12px; }
.btn { font-weight: 700; font-size: 23px; min-height: 54px; padding: 4px 22px; border-radius: 16px; border: 3px solid var(--ink); background: #2b2152; color: var(--text); box-shadow: 0 5px 0 var(--ink); text-align: left; cursor: pointer; transition: transform .08s, background .12s; }
.btn:hover:not(:disabled) { background: #3a2c6e; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn.main { background: var(--cyan); color: #0f2228; }
.btn.main:hover:not(:disabled) { background: #92f8f8; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .tile:focus-visible, .toggle:focus-visible, .linkbtn:focus-visible, input:focus-visible { outline: 3px solid #ffd34f; outline-offset: 3px; }
.btn.small { min-height: 44px; font-size: 19px; }
.page { padding: 26px 48px; height: 100%; box-sizing: border-box; background: rgba(13,7,25,.6); }
.page header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
h2 { font-weight: 800; font-size: 42px; margin: 0; color: var(--text); line-height: 1.05; }
h3 { font-weight: 800; font-size: 23px; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.tile { position: relative; height: 186px; border-radius: 18px; border: 3px solid var(--ink); background: var(--bg); box-shadow: 0 5px 0 var(--ink); color: var(--text); text-align: left; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; cursor: pointer; }
.tile:hover:not(:disabled) { transform: translateY(-2px); }
.tile .num { position: absolute; top: 2px; left: 14px; font-weight: 800; font-size: 58px; color: var(--acc); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.tile .nm { font-weight: 700; font-size: 20px; line-height: 1.1; }
.tile .sc { font-family: 'Nunito', sans-serif; font-size: 14px; opacity: .85; }
.tile .check { position: absolute; top: 14px; right: 14px; background: #6fe04a; color: #10301a; border: 2px solid var(--ink); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-weight: 900; }
.tile.locked { filter: grayscale(.85) brightness(.55); cursor: default; }
.panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 22px; padding: 22px 26px; color: #e8e2f7; box-shadow: 0 6px 0 var(--ink); }
.form { display: flex; flex-direction: column; gap: 14px; max-width: 600px; }
.slider { display: grid; grid-template-columns: 150px 1fr 44px; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; }
.slider output { text-align: right; color: var(--cyan); }
input[type=range] { accent-color: var(--cyan); height: 30px; }
.toggle { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; font: 600 17px 'Nunito', sans-serif; cursor: pointer; text-align: left; padding: 4px 0; }
.toggle .knob { width: 48px; height: 28px; border-radius: 14px; background: #3a2c5e; border: 2px solid var(--ink); position: relative; flex: none; }
.toggle .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--lav); transition: left .15s; }
.toggle.on .knob { background: #1fb5b8; }
.toggle.on .knob::after { left: 23px; background: #fff; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 16px; }
dt { font-weight: 800; color: var(--cyan); } dd { margin: 0; }
.legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; font-size: 16px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; vertical-align: -2px; border: 2px solid var(--ink); }
.cy { background: var(--cyan); } .or { background: linear-gradient(90deg, #ff8a1f 50%, #ff3fb4 50%); } .gr { background: #6fe04a; } .go { background: #e0b84a; } .dash { border: 2px dashed #ff3fb4; background: none; }
.center { display: grid; place-items: center; height: 100%; }
.dim { background: rgba(10,5,22,.58); }
.narrow { width: 360px; display: flex; flex-direction: column; gap: 12px; }
.result { width: 540px; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 18px; }
td { padding: 3px 0; } td:last-child { text-align: right; font-weight: 800; color: var(--gold); }
.tot td { border-top: 2px solid #3a2c5e; padding-top: 8px; font-size: 21px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.note { color: var(--lav); font-size: 16px; margin: 6px 0; line-height: 1.4; }
.big { font-weight: 800; font-size: 68px; color: var(--gold); margin: 0; line-height: 1; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.victory { text-align: center; } .victory h2 { font-size: 36px; } .victory .row { justify-content: center; } .vicimg { width: 120px; height: 120px; margin-top: -60px; }
.pausebtn { position: absolute; top: 10px; right: 14px; width: 52px; height: 52px; border-radius: 14px; border: 3px solid var(--ink); background: rgba(43,33,82,.85); display: flex; gap: 8px; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.pausebtn span { width: 7px; height: 20px; background: var(--text); border-radius: 2px; }
.joyzone { position: absolute; left: 0; top: 80px; width: 420px; height: 460px; touch-action: none; }
.joybase { position: absolute; left: 50px; top: 320px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(201,189,232,.6); background: rgba(43,33,82,.35); opacity: .45; pointer-events: none; }
.joyknob { position: absolute; left: 32px; top: 32px; width: 50px; height: 50px; border-radius: 50%; background: rgba(201,189,232,.85); border: 3px solid var(--ink); }
.specialbtn { position: absolute; right: 30px; bottom: 30px; width: 108px; height: 108px; border-radius: 50%; border: 4px solid var(--ink); background: #2b4c5a; color: #9fdfe6; font: 800 24px 'Baloo 2', sans-serif; touch-action: none; box-shadow: 0 5px 0 var(--ink); }
.specialbtn.ready { background: var(--cyan); color: #0f2228; }
.loading { font-weight: 700; font-size: 28px; color: var(--lav); }
.best { color: var(--gold); font-weight: 700; margin: 4px 2px; }
.rotate { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: var(--gold); font-size: 18px; }
.linkbtn { background: none; border: 0; color: #ff9ad5; text-decoration: underline; font: 600 15px 'Nunito', sans-serif; cursor: pointer; align-self: flex-start; padding: 0; }
.confirm p { margin: 0 0 12px; font-size: 17px; line-height: 1.4; }

/* ---------------- v2 additions ---------------- */
.small { font-size: 14px; }
.ok { color: #9ff7a0; font-weight: 700; margin: 6px 0; }
.err { color: #ff9ab0; font-weight: 700; margin: 6px 0; }
.hint { font-size: 14px; margin: 4px 0 8px; color: var(--lav); min-height: 20px; }
.hint.ok { color: #9ff7a0; } .hint.bad { color: #ff9ab0; }
.wide { width: 520px; }
.row.tight { gap: 8px; }
.row.tight .btn { flex: 1; text-align: center; padding: 4px 10px; }
.title .menu .btn { width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 15px; margin: 8px 0; }
.field input, .field select, .rankhead select { font: 600 18px 'Nunito', sans-serif; padding: 10px 12px; border-radius: 12px; border: 3px solid var(--ink); background: #f3eefc; color: #1a1030; min-height: 48px; box-sizing: border-box; }
.field input.code { letter-spacing: 6px; font-size: 26px; text-align: center; }
.phone { display: grid; grid-template-columns: 220px 1fr; gap: 10px; }

.seg button { font: 700 16px 'Baloo 2', sans-serif; color: var(--text); background: none; border: 0; padding: 8px 16px; min-height: 42px; cursor: pointer; }
.seg button.on { background: var(--cyan); color: #0f2228; }
.seg button:focus-visible { outline: 3px solid #ffd34f; outline-offset: -3px; }
.authpage { height: 100%; display: grid; place-items: center; background: rgba(13,7,25,.55); }
.auth { width: 560px; box-sizing: border-box; }
.auth h2 { font-size: 34px; }
.steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 12px; counter-reset: s; }
.steps li { flex: 1; font-size: 13px; font-weight: 700; color: #8a7fb0; border-top: 4px solid #3a2c5e; padding-top: 4px; }
.steps li.on { color: var(--cyan); border-color: var(--cyan); } .steps li.done { color: #9ff7a0; border-color: #6fe04a; }
.userchip { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 24px; border: 3px solid var(--ink); background: rgba(43,33,82,.9); color: var(--text); font: 700 17px 'Baloo 2', sans-serif; cursor: pointer; }
.portrait { border-radius: 50%; background: #2b2152; border: 2px solid var(--ink); flex: none; }
.portrait.locked { filter: grayscale(1) brightness(.45); }
.worlds { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 10px; }
.wtab { border: 3px solid var(--ink); border-radius: 12px; background: #2b2152; color: var(--text); padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-family: 'Baloo 2', sans-serif; }
.wtab b { font-size: 20px; color: var(--acc); line-height: 1.1; } .wtab span { font-size: 12px; opacity: .85; }
.wtab.on { background: #3a2c6e; box-shadow: inset 0 -4px 0 var(--acc); } .wtab:disabled { opacity: .4; cursor: default; }
.worldhead { display: flex; align-items: baseline; gap: 14px; margin: 2px 0 10px; } .worldhead h3 { color: var(--acc); margin: 0; }
.page .grid .tile { height: 150px; }
.tile .num { font-size: 40px !important; }
.tile .boss { font-family: 'Nunito', sans-serif; font-size: 12px; color: #ffd9a0; }
.tile.current { box-shadow: 0 5px 0 var(--ink), 0 0 0 3px var(--cyan); }
.avlayout { display: grid; grid-template-columns: 1fr 330px; gap: 16px; }
.avgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.avtile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 3px solid var(--ink); border-radius: 14px; background: #2b2152; color: var(--text); font: 700 14px 'Baloo 2', sans-serif; cursor: pointer; }
.avtile.focus { background: #3a2c6e; box-shadow: 0 0 0 3px var(--cyan); } .avtile.sel::after { content: "Selected"; font-size: 11px; color: #9ff7a0; }
.avinfo { padding: 14px 16px; } .avinfo h3 { margin: 4px 0 0; } .preview { display: block; background: rgba(13,7,25,.5); border-radius: 14px; }
.rankhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.rankhead select { min-height: 42px; font-size: 15px; padding: 6px 10px; }
.period { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.arrow { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--ink); background: #2b2152; color: var(--text); font-size: 22px; cursor: pointer; }
.arrow:disabled { opacity: .35; cursor: default; }
.reset { margin-left: auto; }
.board { max-height: 290px; overflow-y: auto; padding: 10px 18px; }
.lb th { text-align: left; color: #8a7fb0; font-size: 14px; } .lb td { padding: 4px 6px; } .lb td:last-child, .lb th:last-child { text-align: right; }
.lb .pl { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; } .lb td:nth-child(3) { color: var(--gold); font-weight: 800; text-align: right; }
.lb tr.me td { background: rgba(94,242,242,.12); } .mine { color: var(--gold); font-weight: 700; margin: 10px 4px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.who { display: flex; align-items: center; gap: 10px; font: 700 18px 'Baloo 2', sans-serif; color: var(--lav); }
.who.big h3 { margin: 0; font-size: 28px; color: var(--text); }
.contact .seg { margin-bottom: 4px; }
.ui.rm .heroimg { animation: none; }

/* ---------------- Nova Vanguard landing ---------------- */
body.doc { overflow: auto; overflow-x: hidden; }
body.doc #root { position: static; display: block; }
.landing { --navy: #0b1240; --navy2: #121a5a; --violet: #6a48d8; --cy: #5ef2f2; --gold: #e8c45a; color: #eef0ff; font-family: 'Nunito', 'Trebuchet MS', sans-serif; background: linear-gradient(180deg, #0b1240 0%, #160f4a 45%, #0b1240 100%); min-height: 100vh; }
.landing a { color: inherit; }
.landing h1, .landing h2, .landing h3, .lbtn, .brand { font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; }
.lnav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 24px; padding: 10px clamp(16px, 4vw, 48px); padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: rgba(11,18,64,.82); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(94,242,242,.15); }
body.doc::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(11,18,64,.82); backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; text-decoration: none; }
.links { display: flex; gap: 18px; margin-left: auto; font-weight: 700; font-size: 15px; } .links a { text-decoration: none; opacity: .85; } .links a:hover { opacity: 1; color: var(--cy); }
.lbtn { font-weight: 800; font-size: 18px; padding: 10px 22px; min-height: 48px; border-radius: 14px; border: 2px solid rgba(94,242,242,.6); background: rgba(18,26,90,.7); color: #eef0ff; cursor: pointer; }
.lbtn.primary { background: var(--cy); color: #071a2a; border-color: var(--cy); box-shadow: 0 0 0 0 rgba(94,242,242,.5); }
.lbtn.lg { font-size: 21px; padding: 12px 30px; } .lbtn.small { min-height: 40px; padding: 6px 16px; font-size: 16px; }
.lbtn:hover { filter: brightness(1.1); } .lbtn:focus-visible, .landing a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.lhero { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 24px; min-height: min(86vh, 760px); padding: 40px clamp(16px, 5vw, 72px); overflow: hidden; }
.herobg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.herocopy, .heroart { position: relative; z-index: 1; }
.lhero h1 { font-size: clamp(48px, 7.5vw, 104px); line-height: .92; margin: 0; font-weight: 800; letter-spacing: -1px; background: linear-gradient(180deg, #ffffff 30%, #a8d8ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #0b1240); }
.tagline { font-family: 'Baloo 2', sans-serif; font-size: clamp(20px, 2.4vw, 28px); color: var(--gold); margin: 10px 0 6px; font-weight: 700; }
.lead { font-size: 18px; line-height: 1.55; max-width: 46ch; color: #d4d8ff; }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.mainhero { width: 100%; max-width: 620px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); animation: float 3.2s ease-in-out infinite; }
.squad { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
.squad figure { margin: 0; text-align: center; font-weight: 800; font-size: 13px; } .squad img { border-radius: 50%; background: rgba(18,26,90,.8); border: 2px solid rgba(232,196,90,.6); display: block; }
.lsec { padding: 64px clamp(16px, 5vw, 72px); max-width: 1200px; margin: 0 auto; }
.lsec h2 { font-size: clamp(32px, 4vw, 46px); margin: 0 0 8px; }
.muted { color: #aab0e0; font-size: 17px; line-height: 1.55; max-width: 70ch; }
.demowrap { margin-top: 20px; border-radius: 18px; overflow: hidden; border: 2px solid rgba(94,242,242,.35); box-shadow: 0 20px 60px rgba(0,0,0,.4); aspect-ratio: 16/9; }
.demo { width: 100%; height: 100%; display: block; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 18px 0 24px; }
.stat { flex: 1; min-width: 160px; padding: 18px 22px; border-radius: 18px; background: rgba(18,26,90,.6); border: 1px solid rgba(106,72,216,.5); }
.stat b { display: block; font-family: 'Baloo 2', sans-serif; font-size: 56px; line-height: 1; color: var(--cy); } .stat span { font-weight: 700; color: #cfd3ff; }
.worldlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.worldlist li { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; padding: 10px 14px; border-radius: 14px; background: rgba(18,26,90,.5); border-left: 4px solid var(--acc); font-weight: 800; }
.worldlist .wn { grid-row: span 2; font-family: 'Baloo 2', sans-serif; font-size: 26px; color: var(--acc); } .worldlist small { color: #aab0e0; font-weight: 600; }
.herogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 18px; }
.hcard { margin: 0; padding: 10px; border-radius: 16px; background: rgba(18,26,90,.55); border: 1px solid rgba(94,242,242,.15); }
.hcard img { width: 100%; aspect-ratio: 124/84; display: block; }
.hcard figcaption { display: flex; flex-direction: column; } .hcard b { font-family: 'Baloo 2', sans-serif; font-size: 20px; } .hcard span { color: #aab0e0; font-size: 14px; } .hcard small { color: var(--gold); font-weight: 700; } .hcard small.starter { color: var(--cy); }
.split { display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; align-items: start; }
.split p { font-size: 17px; line-height: 1.6; color: #d4d8ff; }
.ticks { padding-left: 20px; line-height: 1.8; color: #d4d8ff; } .ticks li::marker { color: var(--cy); }
.boards { display: grid; gap: 14px; }
.lcard { padding: 18px 20px; border-radius: 18px; background: rgba(18,26,90,.6); border: 1px solid rgba(106,72,216,.45); }
.lcard h3 { margin: 0 0 10px; font-size: 22px; }
.lboard { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.lboard li { display: grid; grid-template-columns: 26px 30px 1fr auto 52px; align-items: center; gap: 10px; font-weight: 700; }
.lboard .rk { color: var(--gold); font-family: 'Baloo 2', sans-serif; font-size: 20px; } .lboard img { border-radius: 50%; background: #121a5a; } .lboard .sc { color: var(--cy); } .lboard .tm { color: #aab0e0; text-align: right; }
.howgrid { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 14px; margin-top: 16px; }
.howgrid dl { grid-template-columns: auto 1fr; } .howgrid dt { color: var(--cy); }
.legendl { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; line-height: 1.45; } .legendl li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.ico { width: 22px; height: 22px; display: inline-block; border: 2px solid #1a1030; margin-top: 2px; }
.ico.star { background: #ffd34f; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); border: 0; }
.ico.plus { background: #6fe04a; border-radius: 6px; position: relative; } .ico.plus::after { content: "+"; position: absolute; inset: -6px 0 0; text-align: center; color: #fff; font-weight: 900; font-size: 22px; }
.ico.hex { background: #6fe04a; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); border: 0; }
.ico.wave { border-radius: 50%; border: 3px solid var(--cy); box-shadow: 0 0 0 4px rgba(94,242,242,.3); }
.ctaband { margin-top: 48px; padding: 32px; border-radius: 22px; text-align: center; background: linear-gradient(120deg, rgba(106,72,216,.45), rgba(47,111,191,.45)); border: 1px solid rgba(94,242,242,.25); } .ctaband .ctas { justify-content: center; }
.lfoot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px clamp(16px, 5vw, 72px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(94,242,242,.15); color: #aab0e0; }
.lfoot nav { display: flex; gap: 20px; font-weight: 700; }
@media (max-width: 900px) { .lhero, .split, .howgrid { grid-template-columns: 1fr; } .links { display: none; } .lnav .lbtn { margin-left: auto; } .lhero { min-height: auto; padding-top: 24px; } }
@media (prefers-reduced-motion: reduce) { .mainhero { animation: none; } }
.landing canvas { position: static; inset: auto; }
.landing .herobg { position: absolute; inset: 0; }
.landing h1 { -webkit-text-stroke: 0; text-shadow: none; paint-order: normal; }
.squad { flex-wrap: wrap; }
.avtile .cat { font: 600 11px 'Nunito', sans-serif; color: #a8b4e8; }
.portrait { object-fit: cover; }
.squad img { object-fit: cover; }
.linkbtn.inline { display: inline; font-size: inherit; }
.row.links { gap: 16px; margin-top: 12px; }
.auth { max-height: 520px; overflow-y: auto; }
.auth .field { margin: 6px 0; } .auth .field input, .auth .field select { min-height: 44px; padding: 8px 12px; }
.cols2 .panel { max-height: 420px; overflow-y: auto; }
.ui canvas.preview { position: static; inset: auto; width: 298px; }
.avgrid { gap: 6px; }
.avtile { padding: 4px 2px; gap: 0; font-size: 13px; }
.avtile .portrait { width: 42px; height: 42px; }
.avlayout { grid-template-columns: 1fr 330px; align-items: start; }
.page { overflow: hidden; }

// ============================================================ spawning

function spawnObstacle(g, kind) {

// ============================================================ bullets & particles

// ============================================================ enemy behaviour
function enemyFire(g, e) {

    case "aimed": shoot(g, mx, my, aim(g, mx, my), sp); break;

function updateObstacles(g, dt) {
  const p = g.player;
  for (const o of g.obs) {
    o.x += o.vx * dt; if (o.flash > 0) o.flash -= dt;

// ============================================================ player
function playerFire(g) {

  for (const a of SHOT_PATTERNS[p.tier]) if (g.pbul.length < MAX_PBUL) g.pbul.push({ x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: 1, age: 0 });
  p.muzzle = 0.06; p.recoil = 2.5;

}

  p.specialCd = SPECIAL_CD; p.charge = BLAST_CHARGE;
  ev(g, "sfx", { name: "charge" });
  return true;
}

// ============================================================ damage & drops

    if (e.shield <= 0) { particle(g, e.x - e.size * 0.4, e.y, "#d6f2ff", 12, 150, 0.5, 3, "shard"); ev(g, "sfx", { name: "shieldbreak" }); }

}

  if (!b || b.entering || b.dying || b.trans > 0) return;

  b.hp -= dmg * mult; b.flash = 0.05;
  if (mult < 0.6 && !raw) { b.clink = 0.1; ev(g, "sfx", { name: "clink" }); } else ev(g, "sfx", { name: "bosshit" });
  if (b.hp <= 0) {
    b.hp = 0; b.dying = true; b.dieT = 0; g.ebul = []; g.hz = [];
    g.score += 3000 + 120 * g.level;

  }
}

// ============================================================ main update
function updateGame(g, dt, input) {
  dt = Math.min(dt, 0.05);
  g.t += dt; g.stateT += dt;
  g.scroll += dt * (g.state === "boss" ? 40 : 70);
  if (g.shake > 0) g.shake -= dt;
  if (g.flash > 0) g.flash -= dt;
  const p = g.player;

  if (g.mode === "campaign") updateCampaignFlow(g, dt); else updateEndlessFlow(g, dt);
  if (g.state === "dead") { p.deadT += dt; if (g.stateT > 1.8 && !g.overSent) { g.overSent = true; if (g.mode === "campaign") ev(g, "gameOver", {}); } }

  if (g.queue.length) for (let i = g.queue.length - 1; i >= 0; i--) {
    const q = g.queue[i];
    if (q.at <= g.t) { if (q.obs) spawnObstacle(g, q.obs); else spawnEnemy(g, q.type, q.y, undefined, { elite: q.elite }); g.queue.splice(i, 1); }
  }

  if (!p.dead) {
    let mx = 0, my = 0;
    if (input.joyX || input.joyY) { mx = input.joyX; my = input.joyY; }
    else { mx = (input.right ? 1 : 0) - (input.left ? 1 : 0); my = (input.down ? 1 : 0) - (input.up ? 1 : 0); const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; } }
    p.x += (mx * PLAYER_SPEED + p.pullX + p.pushX) * dt;
    p.y += (my * PLAYER_SPEED + p.pullY) * dt;
    p.x = clamp(p.x, 50, W - 80); p.y = clamp(p.y, 64, H - 50);
    p.pullX = 0; p.pullY = 0; p.pushX *= Math.pow(0.1, dt); if (Math.abs(p.pushX) < 2) p.pushX = 0;
    p.tilt += (my * 0.12 - p.tilt) * Math.min(1, dt * 10);
    if (p.inv > 0) p.inv -= dt;
    if (p.shield > 0) p.shield -= dt;
    if (p.specialCd > 0) p.specialCd -= dt;
    for (const k of ["muzzle", "hurtT", "healT", "upT"]) if (p[k] > 0) p[k] -= dt;
    p.recoil *= Math.pow(0.0005, dt);
    if (p.charge > 0) { p.charge -= dt; if (p.charge <= 0) { p.charge = 0; releaseBlast(g); } }
    p.fireCd -= dt;
    p.firing = (input.fire || input.autofire) && g.state !== "complete" && p.charge <= 0;
    if (p.firing && p.fireCd <= 0) { p.fireCd = FIRE_INT; playerFire(g); }
    if (input.specialPressed) special(g);
  }
  input.specialPressed = false;
  updateBlast(g, dt);

  for (const b of g.pbul) { b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt; }
  g.pbul = g.pbul.filter((b) => !b.dead && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  for (const b of g.ebul) {
    if (b.homing) {
      const want = Math.atan2(p.y - b.y, p.x - b.x); let da = want - b.ang;
      while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      b.ang += clamp(da, -b.homing * dt, b.homing * dt);
      const s = Math.hypot(b.vx, b.vy); b.vx = Math.cos(b.ang) * s; b.vy = Math.sin(b.ang) * s;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
  }
  g.ebul = g.ebul.filter((b) => !b.dead && b.life > 0 && b.x > -40 && b.x < W + 60 && b.y > -60 && b.y < H + 60);

  for (const e of g.enemies) updateEnemy(g, e, dt);
  g.enemies = g.enemies.filter((e) => !e.dead && e.x > -90 && e.x < W + 200 && e.y > -90 && e.y < H + 90);
  updateObstacles(g, dt);
  if (g.boss) updateBoss(g, dt);
  updateHazards(g, dt);

  for (const k of g.pickups) {
    k.t += dt; k.x -= 55 * dt; k.y += k.vy * dt; k.vy *= Math.pow(0.3, dt);
    if (!p.dead) {
      const dd = d2(k.x, k.y, p.x, p.y);
      if (dd < 90 * 90) { const l = Math.sqrt(dd) || 1; k.x += ((p.x - k.x) / l) * 220 * dt; k.y += ((p.y - k.y) / l) * 220 * dt; }
      if (dd < 26 * 26) { collect(g, k); k.dead = true; }
    }
  }
  g.pickups = g.pickups.filter((k) => !k.dead && k.x > -30);
  for (const q of g.parts) { q.life -= dt; if (!q.ring && !q.flashp) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; if (q.kind === "shard") { q.vy += 160 * dt; q.rot += q.vr * dt; } } }
  g.parts = g.parts.filter((q) => q.life > 0);
  for (const t of g.texts) { t.life -= dt; t.y -= 34 * dt; }
  g.texts = g.texts.filter((t) => t.life > 0);
  collide(g);
}

function updateCampaignFlow(g, dt) {
  const p = g.player;
  if (g.state === "intro" && g.stateT > 2.6) { g.state = "waves"; g.stateT = 0; }
  if (g.state === "waves") {
    g.waveT -= dt; g.sinceLast += dt;
    const done = g.waveIdx >= g.waves.length, fieldClear = g.enemies.length === 0 && g.queue.length === 0;
    if (!done && (g.waveT <= 0 || (fieldClear && g.sinceLast > 2.5))) {
      const w = g.waves[g.waveIdx++];
      const qStart = g.queue.length;
      w.groups.forEach((gr, i) => queueGroup(g, gr[0], gr[1], gr[2], i * 1.6));
      if (w.elite) { const c = g.queue.slice(qStart).filter((q) => !q.obs && typeof q.y === "number"); if (c.length) c[Math.floor(c.length / 2)].elite = true; }
      g.waveT = w.dur; g.sinceLast = 0;
    }
    if (done && ((fieldClear && g.sinceLast > 1.5) || g.sinceLast > 12)) { g.state = "warning"; g.stateT = 0; ev(g, "sfx", { name: "warning" }); ev(g, "warning", {}); }
  }
  if (g.state === "warning" && g.stateT > 3 && !g.boss) {
    g.state = "boss"; g.stateT = 0; g.boss = makeBoss(g); g.bossesSpawned++; g.obs = []; g.queue = [];
    ev(g, "bossStart", { name: g.boss.def.name });
  }
  if (g.state === "boss" && g.boss && g.boss.dying && g.boss.dieT > 2.6) { g.state = "complete"; g.stateT = 0; g.ebul = []; ev(g, "levelComplete", {}); }
}

function updateEndlessFlow(g, dt) {
  if (g.state !== "endless") return;
  for (const s of g.sched.take(g.t)) {
    g.spawnMap.set(s.id, s);
    const y = typeof s.y === "number" ? 40 + s.y * (H - 80) : s.y;
    spawnEnemy(g, s.type, y, undefined, { hp: s.hp, shield: s.shield, sid: s.id, elite: s.elite, score: s.score });
  }
  for (const u of EndlessRules.UPGRADES) if (!g.upDone[u.id] && g.t >= u.t) { g.upDone[u.id] = true; g.pickups.push({ x: W + 20, y: 40 + u.y * (H - 80), kind: "up", t: 0, vy: 0, pid: u.id }); }
  const lvl = EndlessRules.threatLevel(g.t);
  if (lvl !== g.threat) { if (g.threat) { floatText(g, W / 2, 150, `Threat level ${lvl}: more enemies, faster`, "#ff9ad5", 20); ev(g, "sfx", { name: "warning" }); } g.threat = lvl; }
  const m = Math.floor(g.t / 60);
  if (m > g.milestone) { g.milestone = m; const pts = 250 * m; g.score += pts; floatText(g, W / 2, 110, `${m} min survived  +${pts}`, "#ffe08a"); ev(g, "sfx", { name: "clear" }); }
  const th = Math.floor(g.t / 120) % WORLDS.length;
  if (th !== g.theme) { g.theme = th; g.lv = { ...g.lv, pal: WORLDS[th].pal, bg: WORLDS[th].bg, world: WORLDS[th] }; }
  g.diff = 1 + Math.min(g.t / 600, 1) * 0.25; g.fireDiff = 1 + Math.min(g.t / 600, 1) * 0.3;
}

function collect(g, k) {
  const p = g.player;
  if (g.mode === "endless" && k.pid) g.rec.picks.push([r3(g.t), k.pid]);
  const pts = g.mode === "endless" ? EndlessRules.PICK_POINTS : { score: 250, big: 1000, hp: 50, shield: 0, up: 0 };
  if (k.kind === "hp") { const full = p.hp >= PLAYER_HP; p.hp = Math.min(PLAYER_HP, p.hp + 1); p.healT = 0.6; floatText(g, p.x, p.y - 40, full ? "Health full" : "+1 health", "#6fe04a"); }
  else if (k.kind === "shield") { p.shield = p.shieldMax; floatText(g, p.x, p.y - 40, "Shield 6s", "#9ff7c4"); }
  else if (k.kind === "up") {
    p.upT = 0.9;
    if (p.tier < 3) { p.tier++; floatText(g, p.x + 40, p.y - 60, "Weapon Upgraded!", "#ffd34f", 26); floatText(g, p.x + 40, p.y - 34, `${EndlessRules.TIER_SHOTS[p.tier]} shots`, "#ffe08a"); }
    else { g.score += MAX_TIER_BONUS; floatText(g, p.x + 40, p.y - 60, `Max power! +${MAX_TIER_BONUS}`, "#ffd34f", 24); }
  }
  else floatText(g, k.x, k.y - 16, "+" + (pts[k.kind] || 0), "#ffe08a");
  g.score += pts[k.kind] || 0;
  particle(g, k.x, k.y, k.kind === "hp" || k.kind === "shield" ? "#6fe04a" : "#ffd34f", 10, 110, 0.45);
  if (g.parts.length < QUALITY_PARTS[g.quality]) g.parts.push({ ring: true, x: k.x, y: k.y, life: 0.3, max: 0.3, size: 26, color: k.kind === "hp" || k.kind === "shield" ? "#6fe04a" : "#ffd34f" });
  ev(g, "sfx", { name: k.kind === "up" ? "powerup" : k.kind === "hp" ? "heal" : "pickup" });
}

function collide(g) {
  const p = g.player;
  for (const s of g.pbul) {
    for (const e of g.enemies) {
      if (e.dead || e.x > W + 10 || e.t < 0.2) continue;
      const rr = e.r + 6;
      if (d2(s.x, s.y, e.x, e.y) < rr * rr) { s.dead = true; impact(g, s); damageEnemy(g, e, s.dmg, false, 0); break; }
    }
    if (s.dead) continue;
    for (const o of g.obs) if (o.hp && !o.dead && d2(s.x, s.y, o.x, o.y) < (o.kind === "well" ? 18 : o.r + 3) ** 2) { s.dead = true; impact(g, s); damageObstacle(g, o, s.dmg); break; }
    if (s.dead) continue;
    for (const b of g.ebul) if (b.hp > 0 && d2(s.x, s.y, b.x, b.y) < (b.r + 4) * (b.r + 4)) { s.dead = true; b.hp--; if (b.hp <= 0) { b.dead = true; explosion(g, b.x, b.y, 0.5); g.score += 50; } break; }
    if (s.dead || !g.boss || g.boss.entering || g.boss.dying) continue;
    for (const pt of g.boss.parts) if (pt.alive && d2(s.x, s.y, pt.x, pt.y) < (pt.r + 4) * (pt.r + 4)) { s.dead = true; impact(g, s); damagePart(g, pt, s.dmg); break; }
    if (s.dead) continue;
    for (const h of g.boss.hits) if (d2(s.x, s.y, h.x, h.y) < (h.r + 4) * (h.r + 4)) { s.dead = true; damageBoss(g, h, s.dmg); impact(g, s, h.mult < 0.6); break; }
  }
  if (p.dead) return;
  const PR = PLAYER_HITBOX;
  for (const b of g.ebul) if (d2(b.x, b.y, p.x, p.y) < (b.r + PR) * (b.r + PR)) { b.dead = true; hurtPlayer(g); }
  for (const e of g.enemies) {
    if (!e.entered || e.dead) continue;
    const rr = e.r * 0.75 + PR;
    if (d2(e.x, e.y, p.x, p.y) < rr * rr) { hurtPlayer(g); if (e.def.pull && g.mode === "campaign") damageEnemy(g, e, 99, true, 2); }
  }
  for (const o of g.obs) {
    if (o.kind === "rock" && d2(o.x, o.y, p.x, p.y) < (o.r * 0.85 + PR) ** 2) hurtPlayer(g);
    else if (o.kind === "gate") { if (Math.abs(p.x - o.x) < 14 && (p.y < 44 || p.y > H - 44 || o.phase === "on")) hurtPlayer(g); }
    else if (o.kind === "well" && d2(o.x, o.y, p.x, p.y) < 18 * 18) hurtPlayer(g);
  }
  if (g.boss && !g.boss.entering && !g.boss.dying) {
    for (const h of g.boss.body) if (d2(h.x, h.y, p.x, p.y) < (h.r * 0.8 + PR) ** 2) { hurtPlayer(g); break; }
    for (const pt of g.boss.parts) if (pt.alive && d2(pt.x, pt.y, p.x, p.y) < (pt.r * 0.7 + PR) ** 2) { hurtPlayer(g); break; }
  }
}
function impact(g, s, armor) {
  if (g.parts.length >= QUALITY_PARTS[g.quality]) return;
  g.parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.14, max: 0.14, color: armor ? "#e8ecf7" : "#a8fbff", size: armor ? 5 : 7, kind: "spark" });
  if (g.quality > 1) particle(g, s.x, s.y, armor ? "#e8ecf7" : "#5ef2f2", 2, 90, 0.2, 1.6);
}

function updateHazards(g, dt) {
  const p = g.player;
  for (const h of g.hz) {
    h.t += dt;
    const act = h.t >= h.tele && h.t < h.tele + (h.act || 0);
    if (h.onStart && h.t >= h.tele && !h.started) { h.started = true; h.onStart(g, h); }
    h.active = act;
    if (h.follow && h.t < h.tele) h.follow(h);
    if (!act || p.dead) continue;
    switch (h.type) {
      case "laser": { const dx = Math.cos(h.ang), dy = Math.sin(h.ang), px = p.x - h.x, py = p.y - h.y; if (px * dx + py * dy > 0 && Math.abs(px * dy - py * dx) < h.w / 2 + 3) hurtPlayer(g); break; }
      case "hbeam": if (Math.abs(p.y - h.y) < h.h / 2) hurtPlayer(g); break;
      case "vstrike": if (h.kind !== "debris" && Math.abs(p.x - h.x) < h.w / 2) hurtPlayer(g); break;
      case "zone": { const dd = Math.sqrt(d2(h.x, h.y, p.x, p.y)); if (dd < h.r && dd > 1) { p.pullX += ((h.x - p.x) / dd) * h.force; p.pullY += ((h.y - p.y) / dd) * h.force; } if (dd < 16) hurtPlayer(g); break; }
    }
  }
  g.hz = g.hz.filter((h) => h.t < h.tele + (h.act || 0) + 0.05);
}

      h("span", { className: "note small reset" }, isCurrent ? `Resets in ${kind === "weekly" ? Math.floor(hh / 24) + "d " + (hh % 24) + "h " : hh + "h "}${mm}m ${ss}s (Manila time)` : "Final results")),
    h("div", { className: "panel board" },
      err ? h("p", { className: "err" }, err) : !rows ? h("p", { className: "note" }, "Loading…") : rows.length === 0 ? h("p", { className: "note" }, isCurrent ? "No ranked runs yet in this period. Play Endless mode to take first place." : "No ranked runs in this period.") :
      h("table", { className: "lb" }, h("thead", null, h("tr", null, h("th", null, "#"), h("th", null, "Player"), h("th", null, "Score"), h("th", null, "Time"))),
        h("tbody", null, rows.map((r) => h("tr", { key: r.rank, className: r.is_me ? "me" : "" }, h("td", null, r.rank), h("td", { className: "pl" }, h(Portrait, { id: r.avatar, size: 28 }), r.username), h("td", null, fmt(r.score)), h("td", null, ft(r.survival_ms))))))),
    mine && h("p", { className: "mine" }, mine.rank ? `Your position: #${mine.rank} of ${mine.players}, best ${fmt(mine.score)}` : `You haven’t set a ranked score in this period. ${mine.players} players have.`));
}

// ============================================================ profile
function Profile({ profile, save, onBack, onRenamed, onAvatars }) {
  const [pw, setPw] = useState(""), [pw2, setPw2] = useState(""), [pwMsg, setPwMsg] = useState(""), [pwErr, setPwErr] = useState(""), [pwTried, setPwTried] = useState(false);
  const changePw = async () => { setPwTried(true); setPwErr(""); setPwMsg(""); if (passwordProblem(pw) || pw !== pw2) return; try { await Net.setPassword(pw); setPw(""); setPw2(""); setPwTried(false); setPwMsg("Password updated. Use it next time you sign in."); } catch (e) { setPwErr(friendlyError(e)); } };
  const [best, setBest] = useState(null); const [name, setName] = useState(profile ? profile.username : ""); const [msg, setMsg] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  useEffect(() => { Net.endlessBest().then(setBest).catch(() => {}); }, []);
  const rename = async () => {
    setErr(""); setMsg("");
    if (!USERNAME_RE.test(name)) return setErr("Usernames are 3–20 characters: letters, numbers and underscores.");
    setBusy(true);
    try { if (!(await Net.usernameAvailable(name))) throw new Error("USERNAME_TAKEN"); const p = await Net.claimUsername(name); onRenamed(p); setMsg("Username updated. Your progress and scores stay with your account."); }
    catch (e) { setErr(friendlyError(e)); } finally { setBusy(false); }
  };
  if (!profile) return null;
  return h(Page, { title: "Profile", onBack },
    h("div", { className: "cols2" },
      h("div", { className: "panel" },
        h("div", { className: "who big" }, h(Portrait, { id: save.avatars.selected, size: 72 }), h("div", null, h("h3", null, profile.username), h("p", { className: "note small" }, `Signed in with ${Net.contactLabel()} (only you can see this)`))),
        h("label", { className: "field" }, h("span", null, "Change username"), h("input", { value: name, maxLength: 20, onChange: (e) => setName(e.target.value.replace(/\s/g, "")) })),
        err && h("p", { className: "err", role: "alert" }, err), msg && h("p", { className: "ok" }, msg),
        h("div", { className: "row" }, h(Btn, { small: true, disabled: busy || name === profile.username, onClick: rename }, busy ? "Saving…" : "Save username"), h(Btn, { small: true, onClick: onAvatars }, "Change avatar"), h(Btn, { small: true, onClick: () => Net.signOut() }, "Sign out"))),
      h("div", { className: "panel" }, h("h3", null, "Progress"),
        h("table", null, h("tbody", null,
          h("tr", null, h("td", null, "Campaign levels cleared"), h("td", null, `${completedCount(save)}/100`)),
          h("tr", null, h("td", null, "Avatars unlocked"), h("td", null, `${save.avatars.unlocked.length}/20`)),
          h("tr", null, h("td", null, "Best campaign total"), h("td", null, fmt(save.campaign.bestTotal))),
          h("tr", null, h("td", null, "Endless best score"), h("td", null, best && best.best_score ? fmt(best.best_score) : "—")),
          h("tr", null, h("td", null, "Ranked endless runs"), h("td", null, best ? fmt(best.valid_runs) : "—")),
          h("tr", null, h("td", null, "Member since"), h("td", null, new Date(profile.created_at).toLocaleDateString())))),
        h("h3", null, "Password"), h(PasswordFields, { pw, setPw, pw2, setPw2, label: "New password", showErrors: pwTried }),
        pwErr && h("p", { className: "err", role: "alert" }, pwErr), pwMsg && h("p", { className: "ok" }, pwMsg),
        h(Btn, { small: true, onClick: changePw }, "Update password"))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

</script>
